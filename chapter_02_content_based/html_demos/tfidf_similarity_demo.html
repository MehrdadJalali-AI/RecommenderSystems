<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TF-IDF Similarity Demo</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --ink: #1f2937;
      --line: #d8d8d0;
      --accent: #2563eb;
      --accent2: #0f766e;
      --card: #ffffff;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.5;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin: 14px 0;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    button, select {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: white;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    .bar {
      height: 12px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
      min-width: 120px;
    }
    .bar span {
      display: block;
      height: 100%;
      background: var(--accent2);
    }
    .tag {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      margin: 2px;
      background: #fafafa;
      font-size: 12px;
    }
    svg {
      max-width: 100%;
      height: auto;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
  </style>
</head>
<body>
<main>
<h1>TF-IDF Similarity Demo</h1>
<p>Type a short query and see which movies share the most distinctive terms.</p>
<section class="panel">
  <input id="query" value="space survival astronaut" style="width:min(520px, 90%); padding:8px; border:1px solid var(--line); border-radius:6px;">
  <button id="searchButton">Search</button>
</section>
<section class="panel"><div id="results"></div></section>
</main>
<script>
const movies = [{"movie_id": 1, "title": "Inception", "genres": "Sci-Fi|Thriller|Action", "director": "Christopher Nolan", "year": 2010, "duration_min": 148, "rating": 8.8, "family_friendly": 0, "description": "A thief enters layered dreams to plant an idea while questioning what is real.", "keywords": "dreams heist subconscious mind-bending"}, {"movie_id": 2, "title": "Interstellar", "genres": "Sci-Fi|Adventure|Drama", "director": "Christopher Nolan", "year": 2014, "duration_min": 169, "rating": 8.7, "family_friendly": 0, "description": "Astronauts travel through a wormhole to find a new home for humanity.", "keywords": "space exploration wormhole survival family"}, {"movie_id": 3, "title": "Titanic", "genres": "Romance|Drama", "director": "James Cameron", "year": 1997, "duration_min": 195, "rating": 7.9, "family_friendly": 0, "description": "A young couple from different social classes fall in love on a doomed ocean liner.", "keywords": "romance ship tragedy historical"}, {"movie_id": 4, "title": "The Matrix", "genres": "Sci-Fi|Action", "director": "The Wachowskis", "year": 1999, "duration_min": 136, "rating": 8.7, "family_friendly": 0, "description": "A hacker discovers that reality is a simulated world controlled by machines.", "keywords": "simulation hacker reality action cyberpunk"}, {"movie_id": 5, "title": "Toy Story", "genres": "Animation|Adventure|Comedy|Family", "director": "John Lasseter", "year": 1995, "duration_min": 81, "rating": 8.3, "family_friendly": 1, "description": "A cowboy doll feels threatened when a space ranger toy becomes the new favorite.", "keywords": "toys friendship family adventure"}, {"movie_id": 6, "title": "Finding Nemo", "genres": "Animation|Adventure|Family", "director": "Andrew Stanton", "year": 2003, "duration_min": 100, "rating": 8.2, "family_friendly": 1, "description": "A cautious clownfish crosses the ocean to rescue his lost son.", "keywords": "ocean rescue family journey fish"}, {"movie_id": 7, "title": "The Dark Knight", "genres": "Action|Crime|Drama", "director": "Christopher Nolan", "year": 2008, "duration_min": 152, "rating": 9.0, "family_friendly": 0, "description": "Batman faces a chaotic criminal who challenges his moral code.", "keywords": "superhero crime chaos justice"}, {"movie_id": 8, "title": "The Martian", "genres": "Sci-Fi|Adventure|Comedy", "director": "Ridley Scott", "year": 2015, "duration_min": 144, "rating": 8.0, "family_friendly": 0, "description": "An astronaut stranded on Mars uses science and humor to survive until rescue.", "keywords": "mars survival science astronaut space"}, {"movie_id": 9, "title": "The Notebook", "genres": "Romance|Drama", "director": "Nick Cassavetes", "year": 2004, "duration_min": 123, "rating": 7.8, "family_friendly": 0, "description": "An elderly man reads a story about a lifelong romance across social barriers.", "keywords": "romance memory love drama"}, {"movie_id": 10, "title": "Paddington", "genres": "Comedy|Family|Adventure", "director": "Paul King", "year": 2014, "duration_min": 95, "rating": 7.3, "family_friendly": 1, "description": "A polite young bear finds a home with a London family and spreads kindness.", "keywords": "family comedy london kindness adventure"}, {"movie_id": 11, "title": "Gravity", "genres": "Sci-Fi|Thriller|Drama", "director": "Alfonso Cuaron", "year": 2013, "duration_min": 91, "rating": 7.7, "family_friendly": 0, "description": "Two astronauts struggle to survive after debris destroys their shuttle.", "keywords": "space survival astronaut disaster orbit"}, {"movie_id": 12, "title": "La La Land", "genres": "Romance|Drama|Music", "director": "Damien Chazelle", "year": 2016, "duration_min": 128, "rating": 8.0, "family_friendly": 0, "description": "A jazz musician and an aspiring actor fall in love while pursuing artistic dreams.", "keywords": "music romance ambition hollywood"}];

function words(text) {
  return text.toLowerCase().replace(/[^a-z0-9\s-]/g, " ").split(/\s+/).filter(w => w.length > 2);
}
const docs = movies.map(m => `${m.title} ${m.genres.replaceAll("|", " ")} ${m.director} ${m.description} ${m.keywords}`);
const vocab = [...new Set(docs.flatMap(words))];
const idf = Object.fromEntries(vocab.map(term => [term, Math.log((1 + docs.length) / (1 + docs.filter(d => words(d).includes(term)).length)) + 1]));
function vector(text) {
  const counts = {};
  words(text).forEach(w => counts[w] = (counts[w] || 0) + 1);
  return Object.fromEntries(vocab.map(t => [t, (counts[t] || 0) * idf[t]]));
}
const docVectors = docs.map(vector);
function cosine(a, b) {
  let dot = 0, na = 0, nb = 0;
  vocab.forEach(t => { dot += a[t] * b[t]; na += a[t] ** 2; nb += b[t] ** 2; });
  return dot / (Math.sqrt(na) * Math.sqrt(nb) || 1);
}
function render() {
  const q = document.querySelector("#query").value;
  const qv = vector(q);
  const rows = movies.map((m, i) => {
    const shared = vocab.filter(t => qv[t] > 0 && docVectors[i][t] > 0).slice(0, 8);
    return { title: m.title, score: cosine(qv, docVectors[i]), shared };
  }).sort((a, b) => b.score - a.score).slice(0, 6);
  document.querySelector("#results").innerHTML = `<table><thead><tr><th>Movie</th><th>Shared terms</th><th>Similarity</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${r.title}</td><td>${r.shared.join(", ") || "Related by weak terms"}</td><td><div class="bar"><span style="width:${Math.min(100, r.score * 100)}%"></span></div>${r.score.toFixed(3)}</td></tr>`).join("") +
    `</tbody></table>`;
}
document.querySelector("#searchButton").addEventListener("click", render);
render();

</script>
</body>
</html>
